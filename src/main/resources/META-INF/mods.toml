modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
logoFile="logo.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''
Fortifies generated villages with perimeter walls, town keeps, and guard towers, and stations villager guards to defend them.

Highly configurable spawn chances for walls, keeps, towers, and guards, with an in-game config screen and structure ID blacklist. Compatible with Guard Villagers so you can use either set of guards, or both.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
